help.category.title=도움말 항목
help.intro.title=시뮬레이터 소개
help.intro.desc=Logic Gate Simulator는 논리 게이트 기반 디지털 회로를 설계하고, 배선 상태와 신호 흐름을 실시간으로 확인하는 편집기입니다.
help.intro.hint=왼쪽의 메뉴를 클릭하여 상세한 사용법을 확인해보세요.
help.component.title=부품 조작 가이드
help.component.add.title=부품 추가하기
help.component.add.desc1=좌측 하단의 'Component' 트리에서 원하는 부품을 더블 클릭하세요. 마우스를 따라다니는 '고스트' 상태가 되면 원하는 위치에 클릭하여 배치할 수 있습니다.
help.component.add.desc2=배치 중에는 그리드 기준으로 위치가 정렬됩니다. Shift를 누르면 스냅 없이 배치할 수 있고, 우클릭 또는 ESC로 배치 모드를 취소할 수 있습니다.
help.component.rotate.title=부품 회전하기
help.component.rotate.desc=부품을 선택하거나 배치 중인 상태에서 Q(반시계) 또는 E(시계) 키를 눌러 10도씩 회전할 수 있습니다. Shift 키를 함께 누르면 90도 단위로 회전합니다.
help.component.move.title=이동 및 선택
help.component.move.desc1=클릭하여 선택하고 드래그하여 이동할 수 있습니다. Ctrl 키를 누른 채 클릭하여 다중 선택이 가능하며, 빈 공간을 드래그하여 영역 선택도 가능합니다.
help.component.move.desc2=선택한 부품은 속성 패널에서 라벨, 라벨 표시 여부, 그룹, 컴포넌트별 속성을 수정할 수 있습니다. Joint의 단자 수처럼 연결에 영향을 주는 속성은 연결 상태에 따라 변경이 제한될 수 있습니다.
help.component.group.title=그룹화
help.component.group.desc=여러 부품을 선택한 뒤 우클릭 메뉴에서 그룹화하거나 그룹화 취소를 할 수 있습니다. 같은 그룹의 부품은 더블클릭으로 함께 선택할 수 있습니다.
help.wiring.title=전선 연결 및 관리
help.wiring.connect.title=전선 연결하기
help.wiring.connect.desc1=부품의 작은 원(핀)을 클릭한 뒤 드래그하여 다른 부품의 핀에 연결하세요. 출력 핀에서 입력 핀으로, 또는 입력에서 출력으로 연결할 수 있습니다.
help.wiring.connect.desc2=일반 입력 핀은 한 개의 전선만 받을 수 있습니다. 입력 핀에서 새 전선을 뽑으면 기존 연결은 먼저 제거됩니다. 출력 핀은 여러 대상에 연결할 수 있습니다.
help.wiring.connect.desc3=Joint는 분기점입니다. 하나의 Joint에는 외부 게이트 출력이 하나만 들어올 수 있으며, 이미 입력을 받은 Joint에는 다른 게이트 출력이 추가로 연결되지 않습니다.
help.wiring.disconnect.title=전선 끊기
help.wiring.disconnect.desc=전선을 클릭하여 선택한 뒤 Delete 또는 Backspace 키를 누르면 삭제됩니다. 또한 입력 핀에서 새로운 선을 뽑으면 기존 연결은 자동으로 끊어집니다.
help.wiring.edit.title=전선 모양 편집
help.wiring.edit.desc1=전선을 우클릭하면 직각 방식 또는 곡선 방식으로 전환할 수 있습니다. 이 설정은 저장, 불러오기, JSON 내보내기/가져오기, 복사/붙여넣기, undo/redo에 포함됩니다.
help.wiring.edit.desc2=전선을 한 번 클릭하면 선택만 됩니다. 선택된 전선을 다시 더블클릭하면 꺾임점 편집 모드가 켜지고, 이때만 꺾임점 핸들이 표시됩니다.
help.wiring.edit.desc3=꺾임점은 전선 우클릭 메뉴의 '꺾임점 추가'로 현재 우클릭 위치에 추가합니다. 편집 모드에서 꺾임점을 선택한 뒤 Delete/Backspace 또는 우클릭 메뉴로 삭제할 수 있습니다.
help.wiring.edit.desc4=직각 전선은 항상 수평/수직 경로로만 표시됩니다. 선분을 잡고 드래그하면 수평 선분은 위아래로, 수직 선분은 좌우로만 움직입니다. Shift를 누르고 드래그하면 그리드 스냅 없이 이동합니다.
help.wiring.edit.desc5=곡선 전선은 꺾임점을 제어점처럼 사용하여 곡선을 조절합니다. 꺾임점이 여러 개일 때는 앞쪽 제어점 중심으로 곡선이 만들어지고 이후 점은 이어서 그려집니다.
help.wiring.status.title=신호 상태 확인
help.wiring.status.desc=시뮬레이션 중 활성화된(HIGH) 전선은 설정된 강조색으로 표시됩니다. 옵션 메뉴에서 이 색상을 자유롭게 변경할 수 있습니다.
help.wiring.grid.title=그리드와 스냅
help.wiring.grid.desc=컴포넌트와 전선 꺾임점은 10px 단위 유닛 그리드에 맞춰 배치됩니다. 옵션에서 큰 그리드 간격, 스냅, 정렬 가이드 표시 여부를 조정할 수 있습니다.
help.gate.title=게이트 도움말
help.gate.search_prompt=게이트, 모드 컴포넌트, 핀 이름 검색
help.shortcut.title=단축키 일람
help.shortcut.copy_paste=선택된 부품 복사 / 붙여넣기
help.shortcut.undo_redo=실행 취소 / 다시 실행
help.shortcut.rotate_10=선택/배치 중인 부품 회전 (10도)
help.shortcut.rotate_90=부품 90도 회전
help.shortcut.delete=선택된 부품, 전선, 또는 편집 모드의 꺾임점 삭제
help.shortcut.select_all=모든 부품 선택
help.shortcut.cancel=배치/배선 모드 취소 및 선택 해제
help.shortcut.camera=카메라 이동 및 확대/축소

