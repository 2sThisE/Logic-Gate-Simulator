help.category.title=Help Categories
help.intro.title=Simulator Introduction
help.intro.desc=Logic Gate Simulator is an editor to design digital circuits based on logic gates and verify wiring states and signal flow in real-time.
help.intro.hint=Click the menu on the left to check detailed usage.
help.component.title=Component Operation Guide
help.component.add.title=Adding Components
help.component.add.desc1=Double click the desired component from the 'Component' tree on the bottom left. When it becomes a 'ghost' following the mouse, click on the desired location to place it.
help.component.add.desc2=During placement, the position is aligned based on the grid. Hold Shift to place without snap, and right-click or ESC to cancel placement mode.
help.component.rotate.title=Rotating Components
help.component.rotate.desc=Select a component or press Q (counterclockwise) or E (clockwise) while placing to rotate by 10 degrees. Hold Shift together to rotate by 90 degrees.
help.component.move.title=Moving and Selecting
help.component.move.desc1=Click to select and drag to move. Multi-selection is possible by clicking while holding Shift, and area selection is also possible by dragging an empty space.
help.component.move.desc2=Selected components can modify labels, label visibility, groups, and component-specific properties in the property panel. Properties affecting connections, such as the number of Joint terminals, may be restricted from changing depending on the connection state.
help.component.group.title=Grouping
help.component.group.desc=Select multiple components, right-click, and group or ungroup them. Components in the same group can be selected together by double-clicking.
help.wiring.title=Wiring and Management
help.wiring.connect.title=Connecting Wires
help.wiring.connect.desc1=Click the small circle (pin) of a component and drag it to connect to the pin of another component. You can connect from output to input or from input to output.
help.wiring.connect.desc2=A general input pin can only receive one wire. If you pull a new wire from the input pin, the existing connection is removed first. Output pins can be connected to multiple targets.
help.wiring.connect.desc3=Joint is a branch point. Only one external gate output can enter a Joint, and other gate outputs cannot be additionally connected to a Joint that has already received an input.
help.wiring.disconnect.title=Disconnecting Wires
help.wiring.disconnect.desc=Click a wire to select it and press Delete or Backspace to delete it. Also, pulling a new wire from an input pin automatically breaks the existing connection.
help.wiring.edit.title=Editing Wire Shapes
help.wiring.edit.desc1=Right-click a wire to switch between orthogonal or curved modes. This setting is included in save, load, JSON export/import, copy/paste, and undo/redo.
help.wiring.edit.desc2=Clicking a wire once only selects it. Double-clicking the selected wire again turns on bend point edit mode, and bend point handles are only displayed then.
help.wiring.edit.desc3=Bend points are added to the current right-click location via the wire's right-click menu 'Add Bend Point'. You can delete a selected bend point in edit mode using Delete/Backspace or the right-click menu.
help.wiring.edit.desc4=Orthogonal wires are always displayed in horizontal/vertical paths. Dragging a segment moves the horizontal segment up/down and the vertical segment left/right. Dragging while holding Shift moves it without grid snap.
help.wiring.edit.desc5=Curved wires use bend points like control points to adjust the curve. When there are multiple bend points, a curve is created around the front control point, and subsequent points are drawn continuously.
help.wiring.status.title=Checking Signal Status
help.wiring.status.desc=During simulation, active (HIGH) wires are displayed in the set highlight color. You can freely change this color in the Options menu.
help.wiring.grid.title=Grid and Snap
help.wiring.grid.desc=Components and wire bend points are placed according to the 10px unit grid. You can adjust the large grid spacing, snap, and alignment guide visibility in the options.
