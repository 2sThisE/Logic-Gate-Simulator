name: Build and Release Native Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build-native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            type: exe
          - os: macos-latest
            type: dmg
          - os: ubuntu-latest
            type: deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Fat JAR
        working-directory: ./Logic-Gate-Simulator
        run: mvn clean package -DskipTests

      - name: Build Native Installer with jpackage
        working-directory: ./Logic-Gate-Simulator
        run: |
          jpackage --type ${{ matrix.type }} --input target --name LogicGateSimulator --main-jar logicgate-1.0.0.jar --main-class com.logicgate.ui.Launcher --app-version 1.0.0

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./Logic-Gate-Simulator/*.exe
            ./Logic-Gate-Simulator/*.dmg
            ./Logic-Gate-Simulator/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
