name: Build and Release Native Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            type: exe
            package-options: --win-menu --win-shortcut --win-dir-chooser --win-per-user-install
          - os: macos-latest
            type: dmg
            package-options: ""
          - os: ubuntu-latest
            type: deb
            package-options: --linux-shortcut

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Fat JAR
        run: mvn clean package -pl Logic-Gate-Simulator -am -DskipTests

      - name: Include Legal Notices
        shell: bash
        run: |
          cp LICENSE ./Logic-Gate-Simulator/target/LICENSE
          cp THIRD_PARTY_NOTICES.md ./Logic-Gate-Simulator/target/THIRD_PARTY_NOTICES.md

      - name: Resolve Release Version
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build Native Installer with jpackage
        working-directory: ./Logic-Gate-Simulator
        shell: bash
        run: |
          mkdir -p dist
          jpackage \
            --type "${{ matrix.type }}" \
            --dest dist \
            --input target \
            --name LogicGateSimulator \
            --main-jar "logicgate-${APP_VERSION}.jar" \
            --main-class com.logicgate.ui.Launcher \
            --app-version "${APP_VERSION}" \
            ${{ matrix.package-options }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./Logic-Gate-Simulator/dist/*.exe
            ./Logic-Gate-Simulator/dist/*.dmg
            ./Logic-Gate-Simulator/dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
